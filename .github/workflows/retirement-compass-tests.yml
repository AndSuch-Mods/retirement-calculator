name: Retirement Compass tests

on:
  push:
    branches:
      - main
      - update/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run calculator regression tests
        run: |
          node retirement-compass/model.test.js
          node retirement-compass/ssa-2027.test.js
          node retirement-compass/ssa-benefit-schedule.test.js
          node retirement-compass/rules-2027.test.js
